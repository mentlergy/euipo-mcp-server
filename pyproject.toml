[project]
name = "euipo-mcp-server"
version = "0.1.0"
description = "MCP server for EUIPO trademark search and goods & services classification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
euipo-mcp-server = "euipo_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euipo_mcp_server"]
